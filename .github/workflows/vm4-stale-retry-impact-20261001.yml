name: VM4 Stale Retry Impact 20261001

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vm4-stale-retry-impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail first attempt intentionally
        if: ${{ github.run_attempt == 1 }}
        run: |
          echo "intentional first-attempt failure"
          exit 1

      - name: Write harmless marker on rerun
        if: ${{ github.run_attempt > 1 }}
        env:
          MARKER_BRANCH: vm4-stale-retry-impact-${{ github.run_id }}
        run: |
          git config user.name "vm4-stale-retry-impact"
          git config user.email "vm4-stale-retry-impact@example.invalid"
          printf 'run_id=%s\nrun_attempt=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > stale-retry-impact.txt
          git checkout -b "$MARKER_BRANCH"
          git add stale-retry-impact.txt
          git commit -m "VM4 stale auto-retry impact marker"
          git push origin "HEAD:refs/heads/$MARKER_BRANCH"
